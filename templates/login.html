{% extends 'base.html' %}
{% block title %}Inloggen{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Inloggen</h1>
<form method="post"><input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
<label class="form-label" for="username">Gebruikersnaam</label><input class="form-control mb-3" id="username" name="username" required autofocus>
<label class="form-label" for="password">Wachtwoord</label><input class="form-control mb-3" id="password" name="password" type="password" required>
<button class="btn btn-primary w-100">Inloggen</button></form>
<p class="mt-3 mb-0">Nog geen account? <a href="{{ url_for('register') }}">Registreren</a></p>
</div></div></div></div>
{% endblock %}
